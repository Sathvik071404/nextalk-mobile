plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.nextalknearby'
version = '1.2.2'

android {
  namespace "expo.modules.nextalknearby"
  defaultConfig {
    versionCode 19
    versionName "1.2.2"
  }
  lintOptions {
    abortOnError false
  }
}

dependencies {
  implementation 'com.google.android.gms:play-services-nearby:19.3.0'
}
